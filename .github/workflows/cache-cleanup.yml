name: Cache cleanup

# Buildx type=gha caches store one entry per layer blob, so entries pile up
# fast (hundreds across branches) and thrash the repo's 10 GB LRU limit.
# Delete a PR's caches (merge ref + head branch ref) as soon as it closes —
# they are never read again.
on:
  pull_request:
    types: [closed]

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      # HEAD_REF is a branch name a PR author controls, and git permits `$`, backticks
      # and `(` in refs — spliced into the script body via ${{ }} it would be shell,
      # not data. Every interpolation here goes through env for that reason.
      - name: Delete caches for the closed PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          for REF in "refs/pull/${PR_NUMBER}/merge" \
                     "refs/heads/${HEAD_REF}"; do
            echo "Deleting caches scoped to $REF"
            gh api "repos/${REPO}/actions/caches?ref=$REF&per_page=100" \
              -q '.actions_caches[].id' | while read -r id; do
              gh api -X DELETE "repos/${REPO}/actions/caches/$id" \
                && echo "  deleted cache $id" \
                || echo "  WARN: failed to delete cache $id"
            done
          done
